[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "storyforge"
version = "0.1.0"
description = "Quan ly trang thai nhan vat, tai nguyen anh va hang doi AI de bien truyen chu thanh video minh hoa co loi doc va truyen tranh."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Phan loi dung chung cho app va worker: chi can pydantic, httpx, pillow.
dependencies = [
  "pydantic>=2.6",
  "httpx>=0.27",
  "pillow>=10.1",
]

[project.optional-dependencies]
# Ung dung quan ly (web UI + API cho worker). Khong phu thuoc model AI nao.
app = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]
# Cac adapter cho worker. Cai theo phan cung cua tung may.
edge = ["edge-tts>=7.0"]
vieneu = ["vieneu"]
rembg = ["rembg[cpu]"]
diffusers = ["torch", "diffusers>=0.36", "transformers", "accelerate", "sentencepiece"]
mac = ["vieneu", "edge-tts>=7.0"]
dev = ["pytest>=8"]

[project.scripts]
storyforge-app = "storyforge.app.cli:main"
storyforge-worker = "storyforge.worker.runner:main"

[tool.hatch.build.targets.wheel]
packages = ["src/storyforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
