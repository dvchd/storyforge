[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "storyforge"
version = "0.2.0"
description = "Quản lý trạng thái nhân vật, tài nguyên ảnh và hàng đợi AI để biến truyện chữ thành video minh họa có lời đọc và truyện tranh."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pydantic>=2.6", "httpx>=0.27", "pillow>=10.1"]

[project.optional-dependencies]
app = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "jinja2>=3.1", "python-multipart>=0.0.9"]
edge = ["edge-tts>=7.0"]
vieneu = ["vieneu"]
rembg = ["rembg[cpu]"]
diffusers = ["torch", "diffusers>=0.36", "transformers", "accelerate", "sentencepiece"]
mac = ["vieneu", "edge-tts>=7.0"]
dev = ["pytest>=8"]

[project.scripts]
storyforge-app = "storyforge.app.cli:main"
storyforge-worker = "storyforge.worker.runner:main"

[tool.hatch.build.targets.wheel]
packages = ["src/storyforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
